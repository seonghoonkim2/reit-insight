# 모델터 계기판 주간 스냅샷 — Analytics Engine 집계를 저장소에 영구 누적
#
# 왜: Cloudflare Analytics Engine 은 데이터를 ~90일만 보관합니다. 매주 집계 스냅샷을
#     data/ae-snapshots/<날짜>.json 으로 커밋해 두면 90일이 지나도 추세가 이어집니다.
#
# 준비(한 번): 저장소 Settings → Secrets and variables → Actions 에 두 개 추가
#   CF_ACCOUNT_ID  = Cloudflare 계정 ID
#   CF_API_TOKEN   = "Account Analytics : Read" 권한 토큰
#   (시크릿이 없으면 이 워크플로우는 조용히 건너뜁니다 — 실패로 뜨지 않습니다.)
#
# 결과: data/ae-snapshots/<날짜>.json 을 자동 브랜치·PR로 올리고 Modelter CI를 실행합니다.
#       필수 체크가 모두 통과하면 자동 머지됩니다. 대시보드는 로컬에서 `node tools/modelter-report.js`
#       실행 후 data/dashboard.html 을 브라우저로 열어 봅니다(트래픽 지표라 공개 배포하지 않음).

name: Modelter snapshot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "집계 범위(일)"
        default: "30"
  schedule:
    - cron: "30 20 * * 1"   # 매주 월요일 20:30 UTC (화 05:30 KST)

permissions:
  actions: write             # 이 실행이 만든 snapshot PR의 action_required CI만 승인
  contents: write            # 스냅샷 브랜치 커밋
  pull-requests: write       # 스냅샷 PR 생성·자동 머지 예약

concurrency:
  group: modelter-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: 시크릿 확인 (없으면 이후 단계 건너뜀)
        id: guard
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::notice::CF_ACCOUNT_ID / CF_API_TOKEN 시크릿이 없어 스냅샷을 건너뜁니다. Settings → Secrets 에 추가하면 매주 자동 누적됩니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: ${{ steps.guard.outputs.ready == 'true' }}
        with:
          node-version: "20"

      - name: 스냅샷 저장 (라이브 AE → data/ae-snapshots/<날짜>.json)
        if: ${{ steps.guard.outputs.ready == 'true' }}
        run: node tools/modelter-ae.js --days "${{ inputs.days || '30' }}" --snapshot

      - name: 대시보드 렌더 스모크 테스트 (에러 없이 생성되는지만 확인)
        if: ${{ steps.guard.outputs.ready == 'true' }}
        run: node tools/modelter-report.js

      - name: 변경분을 브랜치·PR로 올리고 전수 검증 후 자동 머지
        if: ${{ steps.guard.outputs.ready == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ae-snapshots/*.json
          if git diff --cached --quiet; then
            echo "새 스냅샷 없음 — 커밋 생략"
          else
            branch="automation/modelter-snapshot-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "계기판 주간 스냅샷 (자동)"
            git push --set-upstream origin "$branch"

            pr_url=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="계기판 주간 스냅샷 (자동)" \
              -f head="$branch" \
              -f base="master" \
              -f body="Analytics Engine 30일 익명 집계 스냅샷입니다. 딜 수치·임차인명·개인정보는 포함하지 않습니다. Modelter CI 전수 통과 후 자동 머지됩니다." \
              --jq '.html_url')

            echo "스냅샷 PR: $pr_url"
            # GITHUB_TOKEN이 만든 공개 저장소 PR은 재귀 실행 방지를 위해 매번 action_required가 된다.
            # 이 실행이 방금 만든 branch+head SHA의 Modelter CI만 찾아 승인한다.
            head_sha=$(git rev-parse HEAD)
            ci_run_id=""
            for attempt in $(seq 1 12); do
              run_line=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow modelter-ci.yml \
                --branch "$branch" --event pull_request --limit 5 \
                --json databaseId,status,conclusion,headSha \
                --jq ".[] | select(.headSha == \"$head_sha\") | [.databaseId,.status,(.conclusion // \"\")] | @tsv" \
                | head -n 1)
              if [ -n "$run_line" ]; then
                IFS=$'\t' read -r ci_run_id ci_status ci_conclusion <<< "$run_line"
                if [ "$ci_conclusion" = "action_required" ]; then
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/approve"
                  echo "스냅샷 PR CI 승인: run ${ci_run_id} · head ${head_sha}"
                elif [ "$ci_status" = "queued" ] || [ "$ci_status" = "in_progress" ] || [ "$ci_conclusion" = "success" ]; then
                  echo "스냅샷 PR CI 이미 실행 중: run ${ci_run_id}"
                else
                  echo "스냅샷 PR CI가 예상 밖 상태입니다: run ${ci_run_id} · ${ci_status}/${ci_conclusion}" >&2
                  exit 1
                fi
                break
              fi
              sleep 5
            done
            if [ -z "$ci_run_id" ]; then
              echo "스냅샷 PR의 pull_request CI를 찾지 못했습니다: $pr_url" >&2
              exit 1
            fi

            gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --auto --merge

            # 자동 머지가 실제로 끝난 뒤에만 작업 브랜치를 지운다.
            for attempt in $(seq 1 60); do
              state=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
              if [ "$state" = "MERGED" ]; then
                if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                  git push origin --delete "$branch"
                fi
                echo "스냅샷 PR 머지·브랜치 정리 완료: $pr_url"
                exit 0
              fi
              if [ "$state" = "CLOSED" ]; then
                echo "스냅샷 PR이 머지 없이 닫혔습니다: $pr_url" >&2
                exit 1
              fi
              sleep 10
            done
            echo "스냅샷 PR 자동 머지 대기 시간 초과: $pr_url" >&2
            exit 1
          fi
