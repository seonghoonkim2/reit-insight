# 모델터 CI — 푸시/PR마다 모델터 자동 검증 (라이브 배포 전 안전망)
# 깨진 코드/빠진 파일(og.png 등)이 modelter.com으로 나가는 걸 빨간불로 알림.
# ※ 하드 게이트로 만들려면: GitHub 저장소 Settings → Branches →
#    master 보호 규칙에 "Modelter CI" 상태체크 필수 + PR 머지로만 운영.

name: Modelter CI

on:
  push:
    paths:
      - "dart-search/web/modelter/**"
      - "tools/modelter-ci-check.js"
      - "tools/parity/**"
      - ".github/workflows/modelter-ci.yml"
  pull_request:
    paths:
      - "dart-search/web/modelter/**"
      - "tools/modelter-ci-check.js"
      - "tools/parity/**"
      - ".github/workflows/modelter-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    name: 검증 (앱 로드·5개 딜·렌트롤·헤더·og.png)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 모델터 검증
        run: node tools/modelter-ci-check.js
      - name: 엔진 불변식 (경제적 단조성 17건)
        run: node tools/qa/invariants.js

  parity:
    name: 파리티 4딜 (화면 = 엑셀 재계산)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: formulas 설치 (엑셀 수식 독립 재계산)
        run: pip install --quiet formulas openpyxl
      - name: 파리티 전수 (4딜 + 경계 변형)
        run: |
          # 경계 변형은 상시 게이트다.
          #  office_nodebt : 무차입 — 커버리지 분모 0(파일 손상·#DIV/0! 회귀 차단)
          #  office_vac100 : 공실 100% — 수입 0(IRR 미정의 시 #NUM! 이 표지로 새는 것 차단)
          # 전 딜 공통으로 "비유한값 0 · 오류 토큰 0 · 검증 시트 종합 판정 PASS" 도 함께 검사한다.
          for d in office logistics dev refi office_nodebt office_vac100; do
            node tools/parity/gen-xlsx.js "$d"
            python3 tools/parity/check.py "$d"
          done
